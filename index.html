<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sticker Shop</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f7f7ff;
      color: #222;
    }

    header {
      background: linear-gradient(135deg, #7c3aed, #ec4899);
      color: white;
      text-align: center;
      padding: 45px 20px;
    }

    header h1 {
      margin: 0;
      font-size: 42px;
    }

    header p {
      font-size: 18px;
    }

    .shop {
      max-width: 1000px;
      margin: 35px auto;
      padding: 0 20px;
    }

    .stickers {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 25px;
    }

    .sticker {
      background: white;
      border-radius: 20px;
      padding: 20px;
      text-align: center;
      box-shadow: 0 5px 20px rgba(0,0,0,0.08);
    }

    .sticker img {
      width: 100%;
      height: 200px;
      object-fit: contain;
      border-radius: 15px;
      background: #f0f0ff;
    }

    .sticker h2 {
      margin-bottom: 5px;
    }

    .price {
      color: #7c3aed;
      font-size: 20px;
      font-weight: bold;
    }

    .buy {
      display: inline-block;
      margin-top: 10px;
      padding: 12px 22px;
      background: #7c3aed;
      color: white;
      text-decoration: none;
      border-radius: 10px;
      font-weight: bold;
    }

    .buy:hover {
      background: #5b21b6;
    }

    footer {
      text-align: center;
      padding: 30px;
      margin-top: 40px;
      background: #222;
      color: white;
    }
  </style>
</head>

<body>

  <header>
    <h1>✨ My Sticker Shop ✨</h1>
    <p>Cool stickers made with creativity</p>
  </header>

  <main class="shop">
<img src="stickers.png" alt="My Sticker Shop"
     style="width:100%; border-radius:20px; margin-bottom:30px;">
    <h2>🔥 Our Stickers</h2>

    <div class="stickers">

      <div class="sticker">
        <img src="https://placehold.co/400x400/ede9fe/7c3aed?text=Sticker+1" alt="Sticker 1">
        <h2>Cool Sticker</h2>
        <p class="price">$1</p>
        <a class="buy" href="mailto:YOUR-EMAIL@example.com?subject=I want Cool Sticker">
          Buy Now
        </a>
      </div>

      <div class="sticker">
        <img src="https://placehold.co/400x400/fce7f3/db2777?text=Sticker+2" alt="Sticker 2">
        <h2>Happy Sticker</h2>
        <p class="price">$1</p>
        <a class="buy" href="mailto:YOUR-EMAIL@example.com?subject=I want Happy Sticker">
          Buy Now
        </a>
      </div>

      <div class="sticker">
        <img src="https://placehold.co/400x400/dbeafe/2563eb?text=Sticker+3" alt="Sticker 3">
        <h2>Star Sticker</h2>
        <p class="price">$1</p>
        <a class="buy" href="mailto:YOUR-EMAIL@example.com?subject=I want Star Sticker">
          Buy Now
        </a>
      </div>

    </div>

  </main>

  <footer>
    © 2026 My Sticker Shop
  </footer>

</body>
</html>
